# Build performance
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon=true

# KMP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
# Suppress "Disabled Kotlin/Native Targets" warning on Linux CI (iOS targets can't build on Linux)
kotlin.native.ignoreDisabledTargets=true

# Android
android.useAndroidX=true
android.nonFinalResIds=false

# Compose
org.jetbrains.compose.experimental.jscanvas.enabled=false
org.jetbrains.compose.experimental.ios.enabled=true
