# Build performance
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon=true

# KMP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
# Suppress "Disabled Kotlin/Native Targets" warning on Linux CI (iOS targets can't build on Linux)
kotlin.native.ignoreDisabledTargets=true

# Android
android.useAndroidX=true
android.nonFinalResIds=false

# Compose
org.jetbrains.compose.experimental.jscanvas.enabled=false
org.jetbrains.compose.experimental.ios.enabled=true

# Puklic packaging version — SINGLE SOURCE OF TRUTH.
#
# Bumping this drives:
#   - desktop/app/build.gradle.kts -> compose.desktop nativeDistributions.packageVersion
#     (and macOS dmgPackageVersion / packageBuildVersion — same string, no per-OS override)
#   - dev.puklic.desktop.update.Version.CURRENT (generated Kotlin source via
#     :desktop:app's `generateVersionKt` task — DO NOT hand-edit Version.kt)
#   - .deb / .AppImage / .dmg filenames produced by jpackage
#   - GitHub Release tag (v<version>) — keep them in lock-step
#   - AUR PKGBUILD pkgver (rewritten by .github/workflows/aur-publish.yml from tag)
#
# Format: MAJOR.MINOR.PATCH (SemVer) with MAJOR >= 1. Compose Desktop's
# `nativeDistributions` DSL rejects MAJOR == 0 for the Dmg target (validator
# requires MAJOR > 0 — see Compose Multiplatform Gradle plugin source). To
# keep ONE version string across all officially shipped platforms (no per-OS
# override, no half-state — HARD RULE #2), the project version starts at
# 1.0.0. Pre-1.x "0.1.x" tags (v0.1.0, v0.1.1) are historical only.
puklic.version=1.2.10
