apiVersion: v1
kind: ServiceAccount
metadata:
  name: puklic-runner
  namespace: puklic-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: puklic-runner
  namespace: puklic-ci
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: puklic-runner
  namespace: puklic-ci
subjects:
  - kind: ServiceAccount
    name: puklic-runner
    namespace: puklic-ci
roleRef:
  kind: Role
  name: puklic-runner
  apiGroup: rbac.authorization.k8s.io
