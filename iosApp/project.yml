# xcodegen config — generates iosApp/iosApp.xcodeproj
#
# Regenerate after edits:
#   cd iosApp && xcodegen generate
#
# Architect references:
#   docs/03_infrastructure/architect-reports/2026-05-28-apple-distribution.md §2 / §5
#   docs/03_infrastructure/architect-reports/2026-05-28-ios-app-framework.md
#   docs/03_infrastructure/architect-reports/2026-05-28-ios-dependency-graph.md

name: iosApp
options:
  bundleIdPrefix: cz.damek.puklic
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: en
  defaultConfig: Release
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The framework is produced by Gradle; Xcode just links it.
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iosApp/Sources
      - path: iosApp/Resources/Assets.xcassets
    info:
      path: iosApp/Sources/Info.plist
      properties:
        CFBundleDisplayName: Puklic
        CFBundleShortVersionString: "1.2.1"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        CFBundleIconName: AppIcon
        # Required by Compose Multiplatform iOS — `PlistSanityCheck` at app launch
        # asserts this key is set, otherwise throws and crashes the app.
        # YES allows the display to refresh at its native max rate (ProMotion etc.).
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
    # No App Groups entitlement and no PuklicBroadcastUpload extension —
    # iOS screen sharing is OUT of scope per user decision 2026-05-31 (#71).
    # The Apple-native voice call path (FP-14h) does not require an extension
    # or App Group; mic capture happens in-process via AVAudioEngine.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.damek.puklic.app
        DEVELOPMENT_TEAM: GR74KSG8M9
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Entitlements claim aps-environment + keychain-access-groups matching
        # the Puklic App Store provisioning profile (#73). Push is required for
        # Discord call/mention signaling, Keychain Sharing for the iOS token
        # storage path (FP-2 Keychain bridge in :ios:platform).
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        # Manual code signing for local TestFlight builds (HARD RULE #4 LOCAL ONLY).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Puklic App Store"
        # Embed the Compose iOS framework produced by Gradle.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../ios/app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework PuklicShared"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    preBuildScripts:
      - name: "Build Kotlin framework"
        script: |
          cd "$SRCROOT/.."
          ./gradlew :ios:app:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false

# PuklicBroadcastUpload (ReplayKit Broadcast Extension) was removed
# 2026-05-31 per user decision (#71) — iOS screen sharing is out of scope.
# The Broadcast/ directory files (SampleHandler.swift etc.) are kept on disk
# for the time a future iOS screencast slice may need them, but the target is
# no longer built or signed.
