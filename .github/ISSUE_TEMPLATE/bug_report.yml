name: Bug report
description: Report a defect in Puklic
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Stručně popiš co se stalo. Detaily (verze, platforma, kroky) doplníme později — neboj se odeslat i krátký report.

        **Nikdy nesdílej token / heslo / Discord credentials.**
  - type: textarea
    id: description
    attributes:
      label: Popis chyby
      description: Co se stalo, kde, jak často. Anglicky nebo česky — jedno.
      placeholder: "Po startu na iOS Sign in failed, viz screenshot…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Verze Puklic
      description: Necháváme předvyplněné na aktuální release. Pokud testuješ jinou, přepiš.
      value: "1.2.6"
    validations:
      required: false
