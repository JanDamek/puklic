name: Mac App Store

# Manual trigger only — Mac App Store uploads are intentional, not on every push.
# Architect: docs/03_infrastructure/architect-reports/2026-05-29-fp14a-mac-app-store-architect.md

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "Submission changelog (visible to Apple reviewers)"
        required: false
        default: "Initial Mac App Store build"

jobs:
  mac_app_store:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: GR74KSG8M9
      BUNDLE_ID: cz.damek.puklic.app
      ASC_KEY_PATH: ${{ github.workspace }}/.appstoreconnect/AuthKey.p8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Ruby (for fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Materialise ASC API key
        run: |
          mkdir -p "$(dirname "$ASC_KEY_PATH")"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"

      - name: Import Mac App Distribution cert
        env:
          P12_BASE64: ${{ secrets.MAC_APP_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_APP_DIST_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > /tmp/mac-app-dist.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/mac-app-dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm /tmp/mac-app-dist.p12

      - name: Import Mac Installer Distribution cert
        env:
          P12_BASE64: ${{ secrets.MAC_INSTALLER_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_INSTALLER_DIST_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > /tmp/mac-installer-dist.p12
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/mac-installer-dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/productsign -T /usr/bin/codesign
          security list-keychains -s build.keychain login.keychain
          security default-keychain -s build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/mac-installer-dist.p12

      - name: Install Mac App Store provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/Puklic_Mac_App_Store.provisionprofile"

      - name: Fastlane mac mac_app_store lane → ASC upload
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane mac mac_app_store

      - name: Cleanup keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
        run: |
          security delete-keychain build.keychain || true
