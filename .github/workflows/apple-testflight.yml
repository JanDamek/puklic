name: Apple TestFlight

# Manual trigger only — TestFlight uploads are intentional, not on every push.
# Architect: docs/03_infrastructure/architect-reports/2026-05-28-apple-distribution.md §5

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "TestFlight build changelog (visible to internal testers)"
        required: false
        default: "Internal build"

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: GR74KSG8M9
      BUNDLE_ID: cz.damek.puklic.app
      # Resolved at runtime from the .p8 secret (see step below).
      ASC_KEY_PATH: ${{ github.workspace }}/.appstoreconnect/AuthKey.p8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Ruby (for fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Materialise ASC API key
        run: |
          mkdir -p "$(dirname "$ASC_KEY_PATH")"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"

      - name: Materialise filled ExportOptions plist
        run: |
          sed \
            -e "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/g" \
            -e "s/BUNDLE_ID_PLACEHOLDER/$BUNDLE_ID/g" \
            -e "s/PROVISIONING_PROFILE_NAME_PLACEHOLDER/${{ secrets.PROVISIONING_PROFILE_NAME }}/g" \
            dist/apple/ExportOptions-AppStore.plist \
            > dist/apple/ExportOptions-AppStore.filled.plist

      - name: Generate iosApp.xcodeproj
        working-directory: iosApp
        run: xcodegen generate

      - name: Build Kotlin/Native framework
        run: ./gradlew :ios:app:linkReleaseFrameworkIosArm64 :ios:app:verifyIosNoGplDeps

      - name: Install Apple Distribution certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
        run: |
          # Apple Distribution .p12 is base64-encoded in a GitHub secret. Decode,
          # create a temporary keychain, import the cert and unlock — fastlane's
          # match isn't used here (single-developer flow, manual signing style).
          echo "$P12_BASE64" | base64 --decode > /tmp/dist.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain login.keychain
          security default-keychain -s build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/dist.p12

      - name: Install App Store provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

      - name: Fastlane beta lane → TestFlight
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane ios beta

      - name: Cleanup keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
        run: |
          security delete-keychain build.keychain || true
