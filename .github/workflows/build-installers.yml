name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
    # Skip pushes that change only docs / CI infrastructure / unrelated workflows.
    # Code changes (shared/, desktop/, gradle/) still trigger.
    paths:
      - 'shared/**'
      - 'desktop/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-installers.yml'
  pull_request:
    branches: [main]
    paths:
      - 'shared/**'
      - 'desktop/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-installers.yml'
  workflow_dispatch:

concurrency:
  group: build-installers-${{ github.ref }}
  # Cancel older runs on the same ref — only the latest commit's installer matters.
  # Tags get their own group (refs/tags/v*) so releases aren't cancelled by main pushes.
  cancel-in-progress: true

# Scope (issue #22 superseded 2026-05-25 per user "všechny platformy stejně",
# HARD RULE #2 — no half-shipping):
#   - Linux x86_64 = canonical shipping target (.deb + .AppImage attached to releases).
#   - macOS arm64  = officially shipped (.dmg attached to releases).
#   - Windows + macOS x86_64 = officially out of scope. Not built. Do not re-add
#     without a CLAUDE.md / docs/07_roadmap update first.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            artifact-glob: |
              desktop/app/build/compose/binaries/main/deb/*.deb
              desktop/app/build/compose/binaries/main/appimage/*.AppImage
          - os: macos-14
            target: macos-arm64
            artifact-glob: |
              desktop/app/build/compose/binaries/main/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Linux deb tooling
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils dpkg-dev

      - name: Build installer (packageDistributionForCurrentOS)
        run: ./gradlew :desktop:app:packageDistributionForCurrentOS --no-daemon --no-configuration-cache --stacktrace

      - name: List built artifacts
        shell: bash
        run: |
          echo "--- compose binaries tree ---"
          find desktop/app/build/compose/binaries -maxdepth 6 -type f 2>/dev/null || true

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: puklic-${{ matrix.target }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Both officially shipped platforms attach to GitHub Releases:
      # Linux x86_64 (.deb + .AppImage) and macOS arm64 (.dmg).
      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: puklic-linux-x86_64
          path: dist

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: puklic-macos-arm64
          path: dist

      - name: List downloaded artifacts
        run: ls -la dist || true

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          draft: true
          body: |
            Puklic installers built by GitHub Actions.

            **Platforms shipped:** Linux x86_64 (.deb + .AppImage) and macOS
            arm64 (.dmg). Windows and macOS x86_64 are out of scope — see
            `CLAUDE.md` §Platforms.

            **Distribution licensing**: these binaries bundle FFmpeg with libx264
            (GPL-2.0). Puklic source code remains Apache-2.0. The combined
            distributed binary is therefore GPL-2.0. See `LICENSE-third-party.txt`
            and `docs/06_ops/licensing.md`.
