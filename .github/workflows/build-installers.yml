name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
    # Skip pushes that change only docs / CI infrastructure / unrelated workflows.
    # Code changes (shared/, desktop/, gradle/) still trigger.
    paths:
      - 'shared/**'
      - 'desktop/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-installers.yml'
  pull_request:
    branches: [main]
    paths:
      - 'shared/**'
      - 'desktop/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-installers.yml'
  workflow_dispatch:

concurrency:
  group: build-installers-${{ github.ref }}
  # Cancel older runs on the same ref — only the latest commit's installer matters.
  # Tags get their own group (refs/tags/v*) so releases aren't cancelled by main pushes.
  cancel-in-progress: true

# Scope (FP-10 2026-05-29, issue #50, HARD RULE #2 — no half-shipping):
#   - Linux x86_64 = officially shipped (.deb + .AppImage attached to releases).
#   - Windows x86_64 = officially shipped (.exe + .msi attached to releases).
#   - macOS arm64 = officially shipped, but built LOCALLY ONLY. The CI runner
#     has no Apple signing identity, so a CI-built .dmg would be unsigned and
#     un-notarized — forbidden to ship (HARD RULE #4, CLAUDE.md). The signed +
#     notarized macOS .dmg is produced on a developer Mac via
#     dist/apple/release-mac-dmg.sh and attached to the release separately.
#   - macOS x86_64 = officially out of scope. Not built.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            artifact-glob: |
              desktop/app/build/compose/binaries/main/deb/*.deb
              desktop/app/build/appimage/*.AppImage
          # macOS arm64 .dmg is intentionally NOT built here. It is built,
          # signed, notarized and attached to the release locally via
          # dist/apple/release-mac-dmg.sh (HARD RULE #4 — Apple builds local-only).
          - os: windows-2022
            target: windows-x86_64
            artifact-glob: |
              desktop/app/build/compose/binaries/main/exe/*.exe
              desktop/app/build/compose/binaries/main/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Linux deb tooling
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils dpkg-dev

      - name: Build installer (packageDistributionForCurrentOS)
        run: ./gradlew :desktop:app:packageDistributionForCurrentOS --no-daemon --no-configuration-cache --stacktrace

      # `packageDistributionForCurrentOS` produces the packaged installers
      # (.deb on Linux, .dmg on macOS) but does NOT emit the jpackage app-image
      # directory we need as input to appimagetool. `createDistributable` is
      # the Compose Desktop task that explicitly emits app-image/Puklic/.
      - name: Build app-image directory (Linux only)
        if: startsWith(matrix.os, 'ubuntu')
        run: ./gradlew :desktop:app:createDistributable --no-daemon --no-configuration-cache --stacktrace

      # Compose Desktop's `TargetFormat.AppImage` is jpackage's `--type app-image`
      # which emits a runtime DIRECTORY tree (build/compose/binaries/main/app-image/Puklic/),
      # NOT a real .AppImage file. We wrap it into a real .AppImage with
      # appimagetool. See desktop/app/src/main/appimage/build-appimage.sh.
      - name: Package AppImage (Linux only)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^puklic\.version=' gradle.properties | cut -d= -f2)"
          if [ -z "$VERSION" ]; then
            echo "ERROR: puklic.version not found in gradle.properties" >&2
            exit 1
          fi
          # Locate the jpackage app-image dir. Compose Desktop's
          # createDistributable emits it as a single subdirectory under
          # build/compose/binaries/main/app/ (the dir name is the packageName,
          # i.e. "Puklic"). Resolve robustly.
          ROOT="desktop/app/build/compose/binaries/main"
          echo "--- inspecting $ROOT ---"
          find "$ROOT" -maxdepth 3 -mindepth 1 -type d 2>/dev/null || true
          APP_IMAGE_DIR=""
          for candidate in "$ROOT/app/Puklic" "$ROOT/app-image/Puklic"; do
            if [ -d "$candidate" ] && [ -x "$candidate/bin/Puklic" ]; then
              APP_IMAGE_DIR="$candidate"
              break
            fi
          done
          if [ -z "$APP_IMAGE_DIR" ]; then
            echo "ERROR: could not locate jpackage app-image dir under $ROOT" >&2
            exit 1
          fi
          echo "Using APP_IMAGE_DIR=$APP_IMAGE_DIR"
          OUT_DIR="desktop/app/build/appimage"
          ICON_PATH="icons/linux/512x512/puklic.png"
          mkdir -p "$OUT_DIR"
          PUKLIC_VERSION="$VERSION" \
            APP_IMAGE_DIR="$APP_IMAGE_DIR" \
            OUT_DIR="$OUT_DIR" \
            ICON_PATH="$ICON_PATH" \
            bash desktop/app/src/main/appimage/build-appimage.sh

      - name: List built artifacts
        shell: bash
        run: |
          echo "--- compose binaries tree ---"
          find desktop/app/build/compose/binaries -maxdepth 6 -type f 2>/dev/null || true
          echo "--- appimage output ---"
          find desktop/app/build/appimage -maxdepth 2 -type f 2>/dev/null || true

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: puklic-${{ matrix.target }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # CI attaches the Linux x86_64 (.deb + .AppImage) and Windows x86_64
      # (.exe + .msi) installers. The macOS arm64 .dmg is signed + notarized +
      # attached separately by a developer Mac (dist/apple/release-mac-dmg.sh,
      # HARD RULE #4) — CI never produces or uploads a macOS .dmg.
      - name: Download Linux installer
        uses: actions/download-artifact@v8
        with:
          name: puklic-linux-x86_64
          path: dist

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: puklic-windows-x86_64
          path: dist

      - name: List downloaded artifacts
        run: ls -la dist || true

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          generate_release_notes: true
          draft: true
          body: |
            Puklic installers built by GitHub Actions.

            **Platforms shipped:** Linux x86_64 (.deb + .AppImage) and
            Windows x86_64 (.exe + .msi). The macOS arm64 .dmg is signed +
            notarized on a developer Mac and attached to this release
            separately (local build via `dist/apple/release-mac-dmg.sh`,
            HARD RULE #4 — Apple builds are local-only and never run on CI).
            macOS x86_64 is out of scope — see `docs/07_roadmap/phases.md`
            §Platforms.

            **Distribution licensing**: these binaries bundle FFmpeg with libx264
            (GPL-2.0). Puklic source code remains Apache-2.0. The combined
            distributed binary is therefore GPL-2.0. See `LICENSE-third-party.txt`
            and `docs/06_ops/licensing.md`.
