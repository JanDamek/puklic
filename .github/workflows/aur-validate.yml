name: AUR validate

on:
  pull_request:
    paths:
      - 'dist/aur/**'
      - '.github/workflows/aur-validate.yml'
  push:
    branches: [main]
    paths:
      - 'dist/aur/**'
      - '.github/workflows/aur-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Validate PKGBUILD (namcap + .SRCINFO drift check)
        run: |
          # mksrcinfo (pacman-contrib) was removed in 2020; the canonical command
          # is `makepkg --printsrcinfo`. makepkg refuses to run as root, hence
          # the dedicated builder user.
          docker run --rm -v "$PWD/dist/aur:/work" -w /work archlinux:latest bash -c '
            pacman -Sy --noconfirm namcap
            useradd -m builder
            chown -R builder:builder /work
            su - builder -c "cd /work && makepkg --printsrcinfo > .SRCINFO.regen"
            diff -u .SRCINFO .SRCINFO.regen || (echo "::error::.SRCINFO is out of sync with PKGBUILD — run makepkg --printsrcinfo > .SRCINFO and commit" && exit 1)
            rm .SRCINFO.regen
            namcap PKGBUILD
          '
