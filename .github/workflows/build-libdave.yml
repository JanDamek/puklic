name: Build libdave natives

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-libdave.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            ext: so
          - os: macos-14
            target: macos-arm64
            ext: dylib
          - os: macos-13
            target: macos-x86_64
            ext: dylib
          - os: windows-2022
            target: windows-x86_64
            ext: dll
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone libdave (with FULL vcpkg submodule)
        shell: bash
        run: |
          # libdave's vcpkg submodule needs FULL history for baseline lookup
          # (vcpkg.json pins baseline commit d07689ef...). Any shallow depth
          # eventually misses it. vcpkg repo is small enough — full clone.
          git clone --depth 1 https://github.com/discord/libdave.git libdave
          cd libdave
          git submodule update --init cpp/vcpkg
          ls cpp/vcpkg/scripts/buildsystems/vcpkg.cmake
          ( cd cpp/vcpkg && git log --oneline -1 d07689ef165f033de5c0710e4f67c193a85373e1 )

      - name: Linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev curl zip unzip tar ninja-build

      - name: macOS build deps
        if: startsWith(matrix.os, 'macos')
        run: brew install cmake pkg-config ninja

      - name: Windows build deps
        if: startsWith(matrix.os, 'windows')
        run: choco install cmake ninja --no-progress --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Build libdave (POSIX)
        if: "!startsWith(matrix.os, 'windows')"
        shell: bash
        run: |
          cd libdave/cpp
          make shared

      - name: Build libdave (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          cd libdave/cpp
          # On Windows the Makefile may not work directly; try make first, then fall
          # back to cmake. mingw32-make / GNU make is usually available on the
          # windows-2022 runner via Git for Windows.
          if command -v make >/dev/null 2>&1; then
            make shared || cmake -S . -B build -G Ninja -DBUILD_SHARED_LIBS=ON && cmake --build build
          else
            cmake -S . -B build -G Ninja -DBUILD_SHARED_LIBS=ON
            cmake --build build
          fi

      - name: Locate built lib
        id: locate
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "windows-x86_64" ]; then
            FILE=$(find libdave/cpp -type f -name '*.dll' | head -1)
            DEST=dave.dll
          else
            FILE=$(find libdave/cpp -type f -name "*.${{ matrix.ext }}" | head -1)
            DEST=libdave.${{ matrix.ext }}
          fi
          if [ -z "$FILE" ]; then
            echo "No built library found for ${{ matrix.target }}" >&2
            find libdave/cpp -maxdepth 6 -type f | head -50 >&2
            exit 1
          fi
          echo "src=$FILE" >> "$GITHUB_OUTPUT"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp "$FILE" "out/$DEST"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libdave-${{ matrix.target }}
          path: out/${{ steps.locate.outputs.dest }}
          if-no-files-found: error
          retention-days: 90

  collect:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: native-libs

      - name: Layout libs into resources tree
        shell: bash
        run: |
          mkdir -p shared/voice-dave/src/jvmMain/resources/libdave
          for dir in native-libs/libdave-*; do
            [ -d "$dir" ] || continue
            target="${dir##*libdave-}"
            mkdir -p "shared/voice-dave/src/jvmMain/resources/libdave/$target"
            cp -v "$dir"/* "shared/voice-dave/src/jvmMain/resources/libdave/$target/"
          done
          find shared/voice-dave/src/jvmMain/resources/libdave -type f | sort

      - name: Open PR with built libs
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat(voice-dave): libdave native libs for all platforms (auto-built)"
          title: "Add libdave native libs (auto-built via CI)"
          body: |
            Built from current main of https://github.com/discord/libdave via
            workflow `build-libdave.yml` run ${{ github.run_id }}.

            Platforms: linux-x86_64, macos-x86_64, macos-arm64, windows-x86_64.

            Re-run via `workflow_dispatch` to rebuild from latest libdave HEAD.
          branch: libdave-libs-${{ github.run_id }}
          add-paths: |
            shared/voice-dave/src/jvmMain/resources/libdave/**
