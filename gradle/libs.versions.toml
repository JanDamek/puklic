[versions]
# Core toolchain
kotlin = "2.1.21"
compose-multiplatform = "1.8.0"
agp = "8.7.2"
jvm-toolchain = "21"
android-min-sdk = "26"
android-target-sdk = "35"
android-compile-sdk = "35"
ios-deployment-target = "14.0"

# Kotlin ecosystem
kotlinx-coroutines = "1.10.1"
kotlinx-serialization = "1.8.0"
kotlinx-datetime = "0.6.2"
# Aligned with the version internally bundled by kotlinx-coroutines-core 1.10.1 so we never
# end up with two atomicfu artefact versions on the classpath. Officially compatible with
# Kotlin 2.1.x (incl. 2.1.21). Apache-2.0.
kotlinx-atomicfu = "0.27.0"

# Networking
ktor = "3.1.3"

# Persistence
sqldelight = "2.1.0"
sqlite-jdbc = "3.47.2.0"

# UI / navigation
decompose = "3.3.0"
essenty = "2.5.0"
coil = "3.1.0"
compose-material3-adaptive = "1.1.0"

# DI
koin = "4.1.0"

# Logging
kermit = "2.0.5"
slf4j = "2.0.13"
logback = "1.5.6"

# Testing
kotest = "5.9.1"

# Build tooling
detekt = "1.23.8"
detekt-compose-rules = "0.4.22"
ktlint = "1.3.1"
ktlint-compose-rules = "0.5.9"
kover = "0.9.1"
gradle-versions-plugin = "0.51.0"
jlleitschuh-ktlint-gradle = "12.1.2"

# Platform-specific (desktop)
jna = "5.16.0"
dbus-java = "5.1.1"

# Native multimedia (JavaCPP bundled libavcodec / FFmpeg GPL build incl. libopus, libx264)
javacpp = "1.5.11"
ffmpeg = "7.1-1.5.11"

# Voice (Phase 3, jvm-only)
# Opus codec: JNA bindings to system libopus (brew install opus / apt install libopus0).
# Pure-JVM concentus (com.github.jitsi:concentus:1.0.2) was blocked — jitpack-only, and
# the local Gradle init script strips non-mavenCentral repos. The restcomm opus-java
# JNI bundle (org.restcomm.media.core.codec.opus:opus-java) ships native libs only for
# linux (libopus_jni_linux); no macOS/Windows/arm64 classifiers exist on Maven Central.
# JNA to system libopus.{dylib,so,dll} is portable, < 100 lines, and requires only a
# package install. See shared/voice/src/jvmMain/kotlin/dev/puklic/voice/codec/LibOpus.kt.
bouncycastle = "1.78"

# DAVE (Phase 3.1b, jvm-only)
# Wire core-crypto: MLS (RFC 9420) over Rust JNI native. GPL-3.0-or-later.
# 4.2.0 pinned per ADR-0007 (architect-reports/2026-05-23-dave-e2ee.md). Brings
# Rust .so/.dylib/.dll for linux-x64, macOS-arm64/x64, win-x64 via the runtime
# dep `core-crypto-uniffi-jvm`. iOS artifact stuck at 0.6.0-rc — iOS DAVE deferred.
wire-core-crypto = "4.2.0"

[libraries]
# Kotlin stdlib (implicit in plugins, but explicit where needed)
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

# Kotlinx ecosystem
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-serialization-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "kotlinx-atomicfu" }

# Ktor networking
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# SQLDelight persistence
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-jdbc-driver = { module = "app.cash.sqldelight:jdbc-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

# UI / Navigation
decompose = { module = "com.arkivanov.decompose:decompose", version.ref = "decompose" }
decompose-compose = { module = "com.arkivanov.decompose:extensions-compose", version.ref = "decompose" }
essenty-lifecycle-coroutines = { module = "com.arkivanov.essenty:lifecycle-coroutines", version.ref = "essenty" }
compose-material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "compose-material3-adaptive" }
coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# DI
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# Logging
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kermit-io = { module = "co.touchlab:kermit-io", version.ref = "kermit" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Testing
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }

# Build tooling / static analysis
detekt-compose-rules = { module = "io.nlopez.compose.rules:detekt", version.ref = "detekt-compose-rules" }
ktlint-compose-rules = { module = "io.nlopez.compose.rules:ktlint", version.ref = "ktlint-compose-rules" }

# Platform-specific (desktop)
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
dbus-java-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbus-java" }
dbus-java-transport-jnr-unixsocket = { module = "com.github.hypfvieh:dbus-java-transport-jnr-unixsocket", version.ref = "dbus-java" }

# JavaCPP + FFmpeg (libavcodec/libavformat/libavdevice/libavutil; GPL build incl. libopus + libx264)
javacpp = { group = "org.bytedeco", name = "javacpp", version.ref = "javacpp" }
ffmpeg-bindings = { group = "org.bytedeco", name = "ffmpeg", version.ref = "ffmpeg" }
ffmpeg-platform-gpl = { group = "org.bytedeco", name = "ffmpeg-platform-gpl", version.ref = "ffmpeg" }

# Voice (Phase 3, jvm-only)
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }

# DAVE / MLS (jvm-only). See architect report 2026-05-23-dave-e2ee.md + ADR-0007.
wire-core-crypto-jvm = { group = "com.wire", name = "core-crypto-jvm", version.ref = "wire-core-crypto" }

[bundles]
ktor-common = [
    "ktor-client-core",
    "ktor-client-websockets",
    "ktor-client-content-negotiation",
    "ktor-serialization-kotlinx-json",
]
kotest-common = [
    "kotest-assertions-core",
    "kotest-property",
]
coil-all = [
    "coil-core",
    "coil-compose",
    "coil-network-ktor3",
]

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "jlleitschuh-ktlint-gradle" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
kotlinx-atomicfu = { id = "org.jetbrains.kotlinx.atomicfu", version.ref = "kotlinx-atomicfu" }
gradle-versions = { id = "com.github.ben-manes.versions", version.ref = "gradle-versions-plugin" }
